name: Deploy to Cloudflare

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Deploy Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VITE_CDP_PROJECT_ID: ${{ secrets.VITE_CDP_PROJECT_ID }}
          VITE_BASE_RPC_URL: ${{ secrets.VITE_BASE_RPC_URL }}
          VITE_ZEROX_API_KEY: ${{ secrets.VITE_ZEROX_API_KEY }}
          VITE_HYPERLIQUID_API_URL: ${{ secrets.VITE_HYPERLIQUID_API_URL }}
          VITE_HYPERLIQUID_WS_URL: ${{ secrets.VITE_HYPERLIQUID_WS_URL }}
        run: bun run deploy
